<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦麦秘籍 · 抽签解签</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6ecd6; --paper2:#ecdcbd; --ink:#3a2a17; --gold:#b8860b; --gold2:#d9a93a;
    --wood:#7a5230; --wood2:#5c3d22; --red:#a83232; --green:#3a7a3a; --line:#d8c39a;
    --calli:"Ma Shan Zheng","STKaiti","KaiTi",cursive;
    --song:"ZCOOL XiaoWei","Noto Serif SC","Songti SC","KaiTi",serif;
    --bg1:#241809; --bg2:#120b04; --glow1:#3a2814; --glow2:#2a1c0e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--song);
    background:
      radial-gradient(1200px 620px at 50% -8%, var(--glow1), transparent 60%),
      radial-gradient(900px 520px at 82% 116%, var(--glow2), transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 72%) fixed;
    color:var(--ink); min-height:100vh; padding:34px 12px;
    transition:background .8s ease;
  }
  .scroll{
    max-width:880px; margin:0 auto; position:relative; padding:0 0 26px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 6px),
      linear-gradient(180deg,var(--paper),var(--paper2));
    border-radius:8px; border:1px solid #c9a85f;
    box-shadow:0 22px 60px rgba(0,0,0,.66), inset 0 0 70px rgba(120,80,30,.18), inset 0 0 0 6px rgba(255,255,255,.07);
  }
  /* 内描金边框 */
  .scroll::before{content:"";position:absolute;inset:10px;border:1px solid rgba(184,134,11,.45);border-radius:4px;pointer-events:none;}
  .rod{height:26px;margin:0 -2px;background:linear-gradient(180deg,#8a5a2c,#5c3d22);
       border-radius:13px; box-shadow:0 5px 12px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.18); position:relative;}
  .rod::before,.rod::after{content:"";position:absolute;top:-7px;width:36px;height:40px;
       background:radial-gradient(circle at 50% 38%,#e7c277,#6e4a22);
       border-radius:50%; box-shadow:0 4px 8px rgba(0,0,0,.5);}
  .rod::before{left:-20px;} .rod::after{right:-20px;}
  .title{text-align:center;padding:28px 16px 10px;position:relative;}
  .title h1{font-size:38px;letter-spacing:10px;color:var(--wood2);font-family:var(--calli);
       text-shadow:0 2px 0 rgba(255,255,255,.35), 0 0 20px rgba(184,134,11,.28);}
  .title .sub{margin-top:8px;color:#9a7b48;font-size:14px;letter-spacing:3px;}
  /* 印章 */
  .seal{position:absolute;top:20px;right:22px;width:56px;height:56px;border-radius:8px;
       background:linear-gradient(135deg,#c0392b,#8e2719);color:#ffe9c0;
       display:flex;align-items:center;justify-content:center;text-align:center;
       font-size:15px;line-height:1.15;letter-spacing:1px;transform:rotate(-8deg);
       box-shadow:0 4px 10px rgba(142,39,25,.5), inset 0 0 0 2px rgba(255,255,255,.32);opacity:.92;}

  /* ===== 签筒入口（最前） ===== */
  .lottery{text-align:center;padding:20px 20px 10px;}
  .tube{width:108px;height:168px;margin:8px auto 6px;position:relative;
        background:
          linear-gradient(90deg, rgba(0,0,0,.28), transparent 16%, transparent 84%, rgba(0,0,0,.28)),
          repeating-linear-gradient(90deg,#8a5a2c 0 7px,#9c6a36 7px 14px,#82542a 14px 21px);
        border-radius:16px 16px 18px 18px;
        box-shadow:0 12px 24px rgba(0,0,0,.5), inset 0 -16px 24px rgba(0,0,0,.34), inset 0 10px 16px rgba(255,255,255,.16);
        border:2px solid #6e4a22;overflow:visible;}
  .tube .mouth{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
        width:104px;height:22px;background:linear-gradient(180deg,#e8c98a,#9a7233);
        border-radius:50%;box-shadow:inset 0 4px 8px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.3);}
  /* 桶口探出的一截签（暗示可抽） */
  .tube::after{content:"";position:absolute;top:-26px;left:50%;transform:translateX(-50%) rotate(-5deg);
        width:13px;height:34px;background:linear-gradient(180deg,#f6e7c0,#d9b878);
        border:1px solid #b8945a;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.3);}
  .tube .slip{position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(8deg);
        width:14px;height:74px;background:linear-gradient(180deg,#f6e7c0,#d9b878);
        border:1px solid #b8945a;border-radius:4px;color:#7a3b1a;font-size:13px;
        display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;
        letter-spacing:3px;box-shadow:0 2px 4px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;}
  .tube.shake{animation:shake .6s ease-in-out;}
  .tube .slip.fly{animation:fly 1s ease-in forwards;}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-8px) rotate(-4deg)}40%{transform:translateX(8px) rotate(4deg)}60%{transform:translateX(-6px) rotate(-3deg)}80%{transform:translateX(6px) rotate(3deg)}}
  @keyframes fly{0%{opacity:1;top:-6px;transform:translateX(-50%) rotate(8deg) scale(1)}40%{opacity:1;top:-90px;transform:translateX(-50%) rotate(380deg) scale(1.1)}100%{opacity:0;top:-130px;transform:translateX(-50%) rotate(720deg) scale(.9)}}
  .lottery-tip{color:#8a6b3a;font-size:14px;letter-spacing:2px;margin:4px 0 8px;}
  .prefs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px;}
  .pref{cursor:pointer;padding:5px 13px;border:1px solid var(--wood);border-radius:14px;
        color:var(--wood2);background:#fff6e0;font-size:13px;user-select:none;transition:all .15s;}
  .pref:hover{transform:translateY(-1px);}
  .pref.on{background:var(--wood);color:#ffe9c0;border-color:var(--wood2);}
  .draw-btn{cursor:pointer;padding:13px 36px;font-size:18px;letter-spacing:3px;
        background:linear-gradient(180deg,#c0392b,#8e2719);color:#ffe9c0;border:none;border-radius:24px;
        box-shadow:0 6px 16px rgba(142,39,25,.5), inset 0 1px 0 #fff3, 0 0 0 3px rgba(217,169,58,.4);font-family:inherit;}
  .draw-btn:hover{transform:translateY(-1px);}
  .draw-btn:disabled{opacity:.6;cursor:default;transform:none;}
  .reveal{margin:14px auto 4px;max-width:520px;display:none;}
  .reveal.show{display:block;animation:fadein .5s ease;}
  .reveal-card{position:relative;background:#fff8ea;border:1px solid var(--line);border-top:4px solid var(--red);border-radius:10px;padding:18px;
        box-shadow:0 6px 18px rgba(184,134,11,.3);text-align:left;overflow:hidden;}
  .reveal-card::after{content:"签";position:absolute;right:10px;bottom:6px;font-size:60px;color:rgba(168,50,50,.07);
        font-family:"KaiTi","STKaiti",serif;line-height:1;pointer-events:none;}
  .rc-title{font-size:22px;color:var(--wood2);text-align:center;letter-spacing:2px;
        background:linear-gradient(180deg,#f3dfb6,#ecd29a);border-radius:6px;padding:6px;margin:-2px -2px 8px;}
  .rc-sub{text-align:center;color:#7a5c30;font-size:14px;margin:6px 0;}
  .rc-fitness{background:#fbf0d2;border-radius:8px;padding:9px 11px;color:#7a5230;font-size:12.5px;line-height:1.8;margin:8px 0;}
  .rc-fitness b{color:var(--red);}
  .rc-tags{margin:8px 0;}
  .rc-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .rc-actions button{cursor:pointer;padding:9px 16px;border-radius:18px;font-size:14px;font-family:inherit;border:1px solid var(--wood);transition:transform .15s, box-shadow .15s;}
  .rc-actions button:hover{transform:translateY(-1px);}
  .confirm-btn{background:linear-gradient(180deg,#2e8b57,#1f6b41);color:#fff;border-color:#1f6b41;}
  .again-btn{background:#fff6e0;color:var(--wood2);}
  .keep-btn{background:#fff6e0;color:var(--wood2);}
  .reveal-note{text-align:center;color:#a83232;font-size:13px;margin-top:8px;display:none;}
  .scroll-body{display:none;}
  .scroll-body.open{display:block;animation:unfold .9s cubic-bezier(.2,.7,.2,1) both;}

  .tabs{display:flex;justify-content:center;gap:10px;margin:16px 0 8px;flex-wrap:wrap;}
  .tab{cursor:pointer;padding:8px 18px;border:1px solid var(--wood);
       border-radius:6px 6px 14px 14px;color:var(--wood2);background:#fff6e0;font-size:15px;
       box-shadow:0 2px 5px rgba(0,0,0,.12);transition:all .15s;}
  .tab:hover{transform:translateY(-1px);}
  .tab.active{background:linear-gradient(180deg,var(--wood),var(--wood2));color:#ffe9c0;
       box-shadow:0 3px 12px rgba(184,134,11,.4);border-color:var(--gold2);}
  .panel{display:none;padding:18px 26px 8px;animation:fadein .5s ease both;}
  .panel.active{display:block;}
  .card{position:relative;background:#fff8ea;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;
        padding:14px 16px;margin:10px 0;box-shadow:0 2px 6px rgba(120,80,30,.12);transition:transform .18s, box-shadow .18s;}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(120,80,30,.2);}
  .card h3{color:var(--wood2);font-size:19px;margin-bottom:4px;}
  .meta{color:#7a5c30;font-size:13px;line-height:1.7;}
  .tag{display:inline-block;background:#f0dcae;color:#7a5230;border-radius:10px;
       padding:1px 9px;font-size:12px;margin:2px 3px;}
  .progress{height:14px;background:#e3d3ad;border-radius:8px;overflow:hidden;margin-top:8px;}
  .progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e0a93a);}
  .steps{display:flex;justify-content:space-between;font-size:12px;color:#7a5c30;margin-top:5px;}
  .steps b{color:var(--green);}
  .ach{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;justify-content:center;}
  .badge{position:relative;width:120px;border-radius:8px;padding:9px 8px;text-align:center;transition:transform .18s;}
  .badge.got{border:1px solid var(--gold);background:linear-gradient(180deg,#fff3cf,#ffe39a);
         box-shadow:0 2px 8px rgba(184,134,11,.35);animation:lantern 3.2s ease-in-out infinite;}
  .badge.got::after{content:"✦";position:absolute;top:-9px;right:-7px;font-size:15px;color:var(--gold);
         background:#fff8ea;border:1px solid var(--gold);border-radius:50%;width:22px;height:22px;line-height:20px;}
  @keyframes lantern{0%,100%{box-shadow:0 2px 8px rgba(184,134,11,.35);}50%{box-shadow:0 2px 20px rgba(184,134,11,.75);}}
  .badge.got:hover{transform:translateY(-2px);}
  .badge.locked{border:1px dashed #c9c2b6;background:#e9e5dd;transform:rotate(-1.4deg);}
  .badge.locked::before{content:"🔒";display:block;font-size:16px;opacity:.55;margin-bottom:2px;}
  .badge.locked .bn{font-size:22px;color:#b3ada4;letter-spacing:3px;line-height:1.3;}
  .badge.locked .bd{color:#b4afa6;font-style:italic;}
  .badge.locked .lock{color:#bcb6ab;font-size:11px;}
  .badge.locked:hover{border-color:#b3ab9c;}
  .badge .bn{font-size:15px;color:var(--wood2);} .badge .bd{font-size:11px;color:#7a5c30;margin-top:3px;}
  .badge .lock{font-size:11px;color:#a08a5a;margin-top:3px;}
  .ach-hint{text-align:center;color:#8a6b3a;font-size:12px;margin-top:10px;font-style:italic;}
  footer{text-align:center;color:#8a6b3a;font-size:12px;padding:14px;}
  .empty{color:#a08a5a;text-align:center;padding:24px;font-style:italic;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @keyframes unfold{from{opacity:0;clip-path:inset(0 48% 0 48%);transform:translateY(6px);}to{opacity:1;clip-path:inset(0 0 0 0);transform:none;}}
  /* 时辰氛围：按真实时辰切换背景色温（夜阑偏蓝 / 破晓偏金 / 当午偏暖 / 向晚偏橙） */
  body.phase-dawn{--bg1:#3a2a12;--bg2:#1a1206;--glow1:#5a3a16;--glow2:#3a2410;}
  body.phase-day{--bg1:#2e2810;--bg2:#15120a;--glow1:#4a3a16;--glow2:#2a2410;}
  body.phase-dusk{--bg1:#3a1e10;--bg2:#1a0e06;--glow1:#5a2a14;--glow2:#3a1a0c;}
  body.phase-night{--bg1:#0e1530;--bg2:#070a16;--glow1:#1a244a;--glow2:#10182f;}

  /* 成就墙江湖评语气泡（hover 浮现） */
  .badge .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);
        background:#2a1c0e;color:#ffe9c0;font-size:11px;line-height:1.6;padding:7px 10px;border-radius:7px;
        width:max-content;max-width:180px;white-space:normal;text-align:center;opacity:0;pointer-events:none;
        transition:opacity .2s, transform .2s;box-shadow:0 6px 16px rgba(0,0,0,.55);z-index:6;}
  .badge .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
        border:6px solid transparent;border-top-color:#2a1c0e;}
  .badge:hover .tip{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    .tube.shake,.tube .slip.fly{animation:none!important;}
    .reveal.show,.scroll-body.open,.panel{animation:none!important;}
    .badge.got{animation:none!important;}
  }
  @media (max-width:600px){
    body{padding:18px 8px;}
    .title h1{font-size:30px;letter-spacing:6px;}
    .seal{width:46px;height:46px;font-size:13px;top:14px;right:12px;}
    .tube{width:92px;height:148px;}
    .panel{padding:14px 14px 6px;}
    .draw-btn{padding:11px 28px;font-size:16px;}
    .badge{width:104px;}
  }
</style>
</head>
<body>
<div class="scroll">
  <div class="rod"></div>
  <div class="title">
    <h1>麦 麦 秘 籍</h1>
    <div class="seal" aria-hidden="true">麦麦<br>秘籍</div>
    <div class="sub" id="gen"></div>
  </div>

  <!-- 签筒入口（最前）：先抽签解签，才开卷轴 -->
  <div class="lottery">
    <div class="tube" id="tube" role="img" aria-label="签筒，抽签入口">
      <div class="mouth"></div>
      <div class="slip" id="slip">签</div>
    </div>
    <div class="lottery-tip">心诚则灵 · 先求一签，方见你的麦麦秘籍</div>
    <div class="prefs" id="prefs">
      <span class="pref" data-pref="beef">🥩 牛肉</span>
      <span class="pref" data-pref="chicken">🍗 鸡肉</span>
      <span class="pref" data-pref="not_spicy">🌿 不辣</span>
      <span class="pref" data-pref="spicy">🌶️ 辣</span>
    </div>
    <button class="draw-btn" id="drawBtn" aria-label="求签：随机抽取一份麦当劳套餐签文">🎋 求签</button>
    <div class="reveal" id="reveal"></div>
    <div class="reveal-note" id="revealNote"></div>
  </div>

  <!-- 卷轴主体（抽签后才展开） -->
  <div class="scroll-body" id="scrollBody">
    <div class="tabs" role="tablist" aria-label="麦麦秘籍四卷">
      <div class="tab active" id="tab-s1" role="tab" aria-selected="true" aria-controls="s1" tabindex="0" data-t="s1">秘籍卷</div>
      <div class="tab" id="tab-s2" role="tab" aria-selected="false" aria-controls="s2" tabindex="-1" data-t="s2">门店卷</div>
      <div class="tab" id="tab-s3" role="tab" aria-selected="false" aria-controls="s3" tabindex="-1" data-t="s3">订单卷</div>
      <div class="tab" id="tab-s4" role="tab" aria-selected="false" aria-controls="s4" tabindex="-1" data-t="s4">成就墙</div>
    </div>
    <div class="panel active" id="s1" role="tabpanel" aria-labelledby="tab-s1"></div>
    <div class="panel" id="s2" role="tabpanel" aria-labelledby="tab-s2"></div>
    <div class="panel" id="s3" role="tabpanel" aria-labelledby="tab-s3"></div>
    <div class="panel" id="s4" role="tabpanel" aria-labelledby="tab-s4"></div>
    <div class="rod"></div>
    <footer>麦麦秘籍 · 由 WorkBuddy 与麦当劳 MCP 共书</footer>
  </div>
</div>

<script>
const DATA = __DATA__;
// 时辰与氛围：按真实时辰切换背景色温，并在副标题标注此刻时辰
(function(){
  const h = new Date().getHours();
  const phase = (h >= 21 || h < 5) ? 'night' : (h < 9 ? 'dawn' : (h < 15 ? 'day' : 'dusk'));
  document.body.classList.add('phase-' + phase);
  const SHICHEN = ['子时','丑时','寅时','卯时','辰时','巳时','午时','未时','申时','酉时','戌时','亥时'];
  const sc = SHICHEN[Math.floor(((h + 1) % 24) / 2)];
  const phaseName = {night:'夜阑',dawn:'破晓',day:'当午',dusk:'向晚'}[phase];
  const gen = document.getElementById('gen');
  if(gen) gen.textContent = '生成于 ' + (DATA.generated || '') + ' ｜ 此刻 ' + sc + '（' + phaseName + '）';
})();

/* ===== 签筒离线抽签：自带菜单池，任何人加载即可抽（通用性） ===== */
const MENU = DATA.menu || [];
const CATEGORY_NAMES = {burger:"单堡", combo:"套餐", burger_plus_side:"堡+小食"};
const TDEE = 2250.0;
const EXERCISES = [
  {key:"walk",name:"散步",verb:"溜达",emoji:"🚶",kcal_per_min:5.3},
  {key:"run",name:"跑步",verb:"跑",emoji:"🏃",kcal_per_min:9.6},
  {key:"badminton",name:"羽毛球",verb:"打羽毛球",emoji:"🏸",kcal_per_min:6.4},
  {key:"pingpong",name:"乒乓球",verb:"打乒乓球",emoji:"🏓",kcal_per_min:4.9},
  {key:"swim",name:"游泳",verb:"游",emoji:"🏊",kcal_per_min:7.4},
  {key:"bike",name:"骑自行车",verb:"骑",emoji:"🚴",kcal_per_min:4.7},
  {key:"rope",name:"跳绳",verb:"跳",emoji:"🤾",kcal_per_min:9.8},
  {key:"yoga",name:"瑜伽",verb:"练",emoji:"🧘",kcal_per_min:3.5}
];
function calcFitness(kcal){
  if(!kcal) return null;
  const details = EXERCISES.map(e=>({...e, minutes:Math.max(1, Math.round(kcal/e.kcal_per_min))}));
  // 与引擎一致：随机推荐一种运动作为「额外抵消」示例
  const rec = details[Math.floor(Math.random()*details.length)];
  return {kcal, daily_pct:Math.round(kcal/TDEE*100),
          rest_hours:Math.round(kcal/(TDEE/24)*10)/10, recommended:rec, details};
}
let selectedPrefs = new Set();
const slipEl = document.getElementById("slip");
const tubeEl = document.getElementById("tube");
const drawBtn = document.getElementById("drawBtn");
const revealEl = document.getElementById("reveal");
const noteEl = document.getElementById("revealNote");
let currentMeal = null;

document.querySelectorAll('#prefs .pref').forEach(p=>{
  p.onclick=()=>{
    const v=p.dataset.pref;
    if(selectedPrefs.has(v)){selectedPrefs.delete(v);p.classList.remove('on');}
    else{selectedPrefs.add(v);p.classList.add('on');}
  };
});

function drawLot(){
  let pool = MENU.slice();
  if(selectedPrefs.size){
    const filtered = pool.filter(it=>(it.tags||[]).some(t=>selectedPrefs.has(t)));
    if(filtered.length) pool = filtered;
  }
  if(!pool.length){
    revealEl.className='reveal show';
    revealEl.innerHTML='<div class="reveal-card"><div class="rc-title">签筒空空</div>'
      +'<div class="rc-sub">当前没有符合口味的餐品，换换偏好再求一签。</div></div>';
    return;
  }
  const pick = pool[Math.floor(Math.random()*pool.length)];
  const fit = calcFitness(pick.kcal);
  currentMeal = pick;

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    showReveal(pick, fit);
    return;
  }
  drawBtn.disabled=true;
  slipEl.style.opacity=1;
  tubeEl.classList.add('shake');
  setTimeout(()=>{
    tubeEl.classList.remove('shake');
    slipEl.classList.add('fly');
    setTimeout(()=>{
      slipEl.classList.remove('fly');
      slipEl.style.opacity=0;
      drawBtn.disabled=false;
      showReveal(pick, fit);
    }, 1000);
  }, 600);
}

function showReveal(pick, fit){
  const catName = CATEGORY_NAMES[pick.category]||pick.category;
  const tags = (pick.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('');
  let fitnessHtml='';
  if(fit){
    fitnessHtml = '<div class="rc-fitness">'+fit.recommended.emoji+' 这顿占每日消耗 <b>'+fit.daily_pct

function confirmMeal(meal){
  const payload = {source:"mcd-scroll", type:"confirm_meal",
    meal:{name:meal.name, category:meal.category, price:meal.price, kcal:meal.kcal, tags:meal.tags||[]}};
  try{ if(window.parent && window.parent!==window) window.parent.postMessage(payload, "*"); }catch(e){}
  const text = "麦麦秘籍·确认下单：" + meal.name + "（¥" + (meal.price??'?') + "，" + (meal.kcal??'?') + "kcal）。请帮我走麦当劳点单并弹支付确认。";
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showSent, showSent);
  } else { showSent(); }
}

/* ===== 以下为卷轴四卷渲染（门店/订单/坐标换算与原有逻辑一致） ===== */
const ORDER_STEPS = ["已下单","已接单","制作中","配送中","已送达"];
function wgs84ToGcj02(lat, lng){
  var pi = 3.14159265358979324, a = 6378245.0, ee = 0.00669342162296594323;
  function outOfChina(la, lo){ return !(lo > 72.004 && lo < 137.8347 && la > 0.8293 && la < 55.8271); }
  function tLat(x, y){
    var r = -100.0 + 2.0*x + 3.0*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20.0*Math.sin(6.0*x*pi) + 20.0*Math.sin(2.0*x*pi)) * 2.0/3.0;
    r += (20.0*Math.sin(y*pi) + 40.0*Math.sin(y/3.0*pi)) * 2.0/3.0;
    r += (160.0*Math.sin(y/12.0*pi) + 320*Math.sin(y*pi/30.0)) * 2.0/3.0;
    return r;
  }
  function tLng(x, y){
    var r = 300.0 + x + 2.0*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20.0*Math.sin(6.0*x*pi) + 20.0*Math.sin(2.0*x*pi)) * 2.0/3.0;
    r += (20.0*Math.sin(x*pi) + 40.0*Math.sin(x/3.0*pi)) * 2.0/3.0;
    r += (150.0*Math.sin(x/12.0*pi) + 300.0*Math.sin(x/30.0*pi)) * 2.0/3.0;
    return r;
  }
  if(outOfChina(lat, lng)) return [lat, lng];
  var dLat = tLat(lng-105.0, lat-35.0), dLng = tLng(lng-105.0, lat-35.0);
  var radLat = lat/180.0*pi, magic = Math.sin(radLat);
  magic = 1 - ee*magic*magic;
  var sq = Math.sqrt(magic);
  dLat = (dLat*180.0)/((a*(1-ee))/(magic*sq)*pi);
  dLng = (dLng*180.0)/(a/sq*Math.cos(radLat)*pi);
  return [lat+dLat, lng+dLng];
}
function routeFromHere(lat, lng, name, fallbackNav, mode){
  var goMap = function(){ if(fallbackNav) window.open(fallbackNav, "_blank"); };
  if(!navigator.geolocation){
    alert("当前环境不支持定位，改为打开地图由你手动指定起点。"); return goMap();
  }
  navigator.geolocation.getCurrentPosition(function(pos){
    var g = wgs84ToGcj02(pos.coords.latitude, pos.coords.longitude);
    var url = "https://api.map.baidu.com/direction?origin=" + g[0].toFixed(6) + "," + g[1].toFixed(6)
      + "|" + encodeURIComponent("我的位置") + "&destination=" + lat + "," + lng + "|" + encodeURIComponent(name)
      + "&mode=" + (mode || "walking") + "&output=html&coord_type=gcj02";
    window.open(url, "_blank");
  }, function(err){
    alert("定位失败或未授权，改为打开地图由你手动指定起点。"); goMap();
  }, {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
}
function orderBar(status){
  let idx = ORDER_STEPS.indexOf(status); if(idx<0) idx=0;
  let pct = Math.round((idx+1)/ORDER_STEPS.length*100);
  let steps = ORDER_STEPS.map((s,i)=> i<=idx?'<b>'+s+'</b>':s).join(' · ');
  return '<div class="progress"><span style="width:'+pct+'%"></span></div><div class="steps">'+steps+'</div>';
}

// tab 切换（支持鼠标点击 + 键盘左右/上下/Home/End 导航，WAI-ARIA 规范）
const tabs = Array.from(document.querySelectorAll('.tab'));
function activateTab(t){
  tabs.forEach(x=>{ x.classList.remove('active'); x.setAttribute('aria-selected','false'); x.tabIndex=-1; });
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); t.setAttribute('aria-selected','true'); t.tabIndex=0;
  document.getElementById(t.dataset.t).classList.add('active');
}
tabs.forEach((t,i)=>{
  t.onclick=()=>activateTab(t);
  t.addEventListener('keydown', e=>{
    let n=null;
    if(e.key==='ArrowRight'||e.key==='ArrowDown') n=tabs[(i+1)%tabs.length];
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp') n=tabs[(i-1+tabs.length)%tabs.length];
    else if(e.key==='Home') n=tabs[0];
    else if(e.key==='End') n=tabs[tabs.length-1];
    if(n){ e.preventDefault(); n.focus(); activateTab(n); }
  });
});
// 「从这里出发」事件委托
document.addEventListener('click', function(e){
  var b = e.target && e.target.closest ? e.target.closest('.btn-here') : null;
  if(!b) return; e.preventDefault();
  var old = b.textContent; b.textContent='定位中…';
  routeFromHere(b.dataset.lat, b.dataset.lng, b.dataset.name, b.dataset.nav, 'walking');
  setTimeout(function(){ b.textContent = old || '从这里出发'; }, 1500);
});
